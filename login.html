<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>PLASU Lecture Tracking System</title>

    <!-- CSS -->
    <link rel="stylesheet" href="css/login.css">

    <!-- Font Awesome -->
    <link rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

</head>

<body>

<div class="container">

    <!-- LEFT SIDE -->
    <div class="left-section">

        <div class="overlay"></div>

        <div class="branding">

            <img src="assets/logo.png"
                 alt="PLASU Logo"
                 class="logo">

            <h1>PLASU</h1>

            <h3>Plateau State University</h3>

            <p class="system-title">
                Smart Lecture Tracking System
            </p>

            <div class="tag-box">
                GPS Verified • Smart Attendance • Hybrid Lectures
            </div>

        </div>

    </div>

    <!-- RIGHT SIDE -->
    <div class="right-section">

        <div class="login-card">

            <h2>Welcome Back</h2>

            <p class="subtitle">
                Login to continue
            </p>

            <form id="loginForm">

                <!-- EMAIL -->
                <div class="input-group">

                    <label>Email Address</label>

                    <div class="input-box">

                        <i class="fa-solid fa-envelope"></i>

                        <input
                        type="email"
                        id="email"
                        placeholder="Enter Email"
                        required>

                    </div>

                </div>

                <!-- PASSWORD -->
                <div class="input-group">

                    <label>Password</label>

                    <div class="input-box">

                        <i class="fa-solid fa-lock"></i>

                        <input
                        type="password"
                        id="password"
                        placeholder="Enter Password"
                        required>

                    </div>

                </div>

                <!-- BUTTON -->
                <button type="submit"
                        class="login-btn">

                    Login

                </button>

            </form>

            <!-- DEMO -->
            <div class="demo-box">

                <h4>Demo Login</h4>

                <p>Email: noelsule8@gmail.com</p>

                <p>Password: 12345</p>

            </div>

        </div>

    </div>

</div>

<!-- JS -->
<script src="js/auth.js"></script>

</body>
</html>
